name: Fetch landing page images

on:
  push:
    branches: [claude/page-visibility-29cz5g]
    paths: [image-sources.txt, .github/workflows/fetch-images.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p images
          fail=0
          while read -r name url; do
            [ -z "$name" ] && continue
            if ! curl -fsSL --retry 3 -o "images/$name" "$url"; then
              echo "FAILED $name $url"; fail=$((fail+1))
            fi
          done < image-sources.txt
          echo "failed: $fail"
          ls images | wc -l
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet && exit 0
          git commit -m "Add landing page images fetched from i.ibb.co"
          git push
